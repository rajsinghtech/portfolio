<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <style>
    .card { fill: #222; stroke: #5dba5d; stroke-width: 1.5; }
