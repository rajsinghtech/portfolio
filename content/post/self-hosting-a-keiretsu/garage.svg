    .hi { fill: #1e3a24; stroke: #5dba5d; stroke-width: 1.8; }
    .t { fill: #e8e8e8; font-family: ui-sans-serif, Helvetica, Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .s { fill: #b8b8b8; font-family: ui-sans-serif, Helvetica, Arial, sans-serif; font-size: 12px; text-anchor: middle; }
    .line { stroke: #c8c8c8; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .mesh { stroke: #5dba5d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
