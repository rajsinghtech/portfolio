<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420">
  <style>
    .card { fill: #222; stroke: #5dba5d; stroke-width: 1.5; }
    .box { fill: #2a2a2a; stroke: #5dba5d; stroke-width: 1.5; }
    .hi { fill: #1e3a24; stroke: #5dba5d; stroke-width: 1.8; }
    .t { fill: #e8e8e8; font-family: ui-sans-serif, Helvetica, Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .ts { fill: #e8e8e8; font-family: ui-sans-serif, Helvetica, Arial, sans-serif; font-size: 13px; text-anchor: middle; }
    .label { fill: #b8b8b8; font-family: ui-sans-serif, Helvetica, Arial, sans-serif; font-size: 11px; text-anchor: middle; }
    .line { stroke: #c8c8c8; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    .mesh { stroke: #5dba5d; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
